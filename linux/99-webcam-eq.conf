# PipeWire filter-chain profile for "USB Camera MIC" (VID_0C45&PID_6301) — TOP OF MONITOR placement
# Install to: ~/.config/pipewire/pipewire.conf.d/99-webcam-eq.conf
# Apply with: systemctl --user restart pipewire pipewire-pulse

context.modules = [
  {
    name = libpipewire-module-filter-chain
    args = {
      node.name        = "effect_stream.webcam_mic_eq"
      node.description = "USB Camera MIC (EQ)"
      media.name       = "USB Camera MIC (EQ)"

      filter.graph = {
        nodes = [
          {
            type   = builtin
            name   = "hp_90"
            label  = bq_highpass
            control = {
              Freq = 90.0
              Q    = 0.707
            }
          }
          {
            type   = builtin
            name   = "pk_125"
            label  = bq_peaking
            control = {
              Freq = 125.0
              Q    = 1.5
              Gain = -4.5
            }
          }
          {
            type   = builtin
            name   = "pk_380"
            label  = bq_peaking
            control = {
              Freq = 380.0
              Q    = 1.1
              Gain = -4.0
            }
          }
          {
            type   = builtin
            name   = "pk_780"
            label  = bq_peaking
            control = {
              Freq = 780.0
              Q    = 1.6
              Gain = -3.5
            }
          }
          {
            type   = builtin
            name   = "pk_2000"
            label  = bq_peaking
            control = {
              Freq = 2000.0
              Q    = 1.3
              Gain = 9.0
            }
          }
          {
            type   = builtin
            name   = "pk_4200"
            label  = bq_peaking
            control = {
              Freq = 4200.0
              Q    = 1.4
              Gain = 9.5
            }
          }
          {
            type   = builtin
            name   = "hs_5500"
            label  = bq_highshelf
            control = {
              Freq = 5500.0
              Q    = 0.707
              Gain = 8.5
            }
          }
        ]

        links = [
          { output = "hp_90:Out"   input = "pk_125:In"  }
          { output = "pk_125:Out"  input = "pk_380:In"  }
          { output = "pk_380:Out"  input = "pk_780:In"  }
          { output = "pk_780:Out"  input = "pk_2000:In" }
          { output = "pk_2000:Out" input = "pk_4200:In" }
          { output = "pk_4200:Out" input = "hs_5500:In" }
        ]
      }

      capture.props = {
        node.name      = "filter_chain.webcam_eq_in"
        audio.position = [ MONO ]
        node.passive   = true
        # Find exact hardware source name via: pactl list short sources
        # target.object = "alsa_input.usb-0c45_6301-02.mono-fallback"
      }

      playback.props = {
        node.name      = "filter_chain.webcam_eq_out"
        media.class    = "Audio/Source"
        audio.position = [ MONO ]
      }
    }
  }
]
